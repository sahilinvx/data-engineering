services:
  postgres:
    image: postgres:16-alpine
    container_name: week4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-de_student}
      POSTGRES_PASSWORD: ${PGPASSWORD:-de_student_pw}
      POSTGRES_DB: ${PGDATABASE:-week4}
    ports:
      # host:container -- 5433 avoids clashing with any Postgres already
      # running on the host's default 5432 port.
      - "5433:5432"
    volumes:
      - week4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  week4_pgdata:
